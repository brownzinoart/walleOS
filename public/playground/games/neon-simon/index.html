<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Simon</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: radial-gradient(circle at top, #11192b 0%, #080b12 55%, #05060a 100%);
      --panel: rgba(10, 14, 26, 0.85);
      --panel-border: rgba(0, 255, 255, 0.35);
      --text-primary: #f4f7ff;
      --text-secondary: rgba(244, 247, 255, 0.65);
      --cyan: #00ffff;
      --magenta: #ff00ff;
      --yellow: #ffe066;
      --lime: #69ff8f;
      --error: #ff5870;
      --success: #3cffd0;
      --glow: 0 0 32px rgba(0, 255, 255, 0.35);
      --transition: 0.24s ease;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text-primary);
    }

    main {
      width: min(680px, 92vw);
      padding: 32px;
      border-radius: 28px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      box-shadow: var(--glow);
      backdrop-filter: blur(12px);
      display: grid;
      gap: 28px;
    }

    header {
      text-align: center;
      display: grid;
      gap: 8px;
    }

    h1 {
      font-size: clamp(2.4rem, 4vw, 3rem);
      margin: 0;
      letter-spacing: 0.04em;
    }

    p {
      margin: 0;
      color: var(--text-secondary);
      font-size: clamp(0.95rem, 1.5vw, 1.05rem);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .pad {
      aspect-ratio: 1;
      border-radius: 26px;
      border: 2px solid rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), filter var(--transition);
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      padding: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    .pad::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.78;
      background: var(--gradient);
      transition: opacity var(--transition), transform var(--transition);
    }

    .pad span {
      position: relative;
      z-index: 1;
    }

    .pad[data-color="cyan"] {
      --gradient: linear-gradient(135deg, rgba(0, 255, 255, 0.85), rgba(0, 135, 255, 0.8));
    }

    .pad[data-color="magenta"] {
      --gradient: linear-gradient(135deg, rgba(255, 0, 255, 0.9), rgba(130, 0, 255, 0.8));
    }

    .pad[data-color="yellow"] {
      --gradient: linear-gradient(135deg, rgba(255, 224, 102, 0.9), rgba(255, 165, 0, 0.8));
    }

    .pad[data-color="lime"] {
      --gradient: linear-gradient(135deg, rgba(105, 255, 143, 0.9), rgba(15, 202, 120, 0.82));
    }

    .pad:active,
    .pad.flash {
      transform: scale(0.96);
    }

    .pad.flash::before,
    .pad:active::before {
      opacity: 1;
      transform: scale(1.04);
    }

    .pad.flash {
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.28);
    }

    .pad.disabled {
      pointer-events: none;
      filter: grayscale(0.35) brightness(0.8);
      opacity: 0.65;
    }

    .hud {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 0.95rem;
    }

    .pill {
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(0, 255, 255, 0.12);
      border: 1px solid rgba(0, 255, 255, 0.4);
      box-shadow: inset 0 0 18px rgba(0, 255, 255, 0.08);
      min-width: 120px;
      text-align: center;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
    }

    button.primary,
    button.secondary {
      padding: 12px 22px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.35);
      color: inherit;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    }

    button.primary:hover,
    button.secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0, 255, 255, 0.18);
    }

    button.primary {
      background: linear-gradient(135deg, rgba(0, 255, 255, 0.3), rgba(130, 0, 255, 0.25));
      border-color: rgba(0, 255, 255, 0.45);
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.06);
    }

    .status {
      text-align: center;
      font-size: 1rem;
      color: var(--text-secondary);
    }

    .status[data-state="error"] {
      color: var(--error);
    }

    .status[data-state="success"] {
      color: var(--success);
    }

    footer {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      line-height: 1.5;
    }

    @media (max-width: 520px) {
      main {
        padding: 24px;
        border-radius: 22px;
      }

      .board {
        gap: 14px;
      }

      .pad {
        border-radius: 20px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Neon Simon</h1>
      <p>Memorize the sequence of glowing pads and repeat it. Each round adds a new color.</p>
    </header>
    <section class="board" aria-label="Simon game board">
      <button class="pad disabled" data-color="cyan" type="button"><span>Cyan</span></button>
      <button class="pad disabled" data-color="magenta" type="button"><span>Magenta</span></button>
      <button class="pad disabled" data-color="yellow" type="button"><span>Yellow</span></button>
      <button class="pad disabled" data-color="lime" type="button"><span>Lime</span></button>
    </section>
    <section class="hud" aria-live="polite">
      <div class="pill" id="round-display">Round 0</div>
      <div class="pill" id="streak-display">Best: 0</div>
    </section>
    <section class="controls">
      <button class="primary" id="start-btn" type="button">Start Game</button>
      <button class="secondary" id="strict-btn" type="button" aria-pressed="false">Strict Mode: Off</button>
    </section>
    <div class="status" id="status" data-state="idle">Press start to begin.</div>
    <footer>
      Strict mode restarts the sequence after a mistake.<br />
      Tip: Watch for the rhythm to keep pace in later rounds.
    </footer>
  </main>
  <script>
    const pads = Array.from(document.querySelectorAll('.pad'));
    const startBtn = document.getElementById('start-btn');
    const strictBtn = document.getElementById('strict-btn');
    const roundDisplay = document.getElementById('round-display');
    const streakDisplay = document.getElementById('streak-display');
    const statusEl = document.getElementById('status');

    const toneMap = {
      cyan: 392,
      magenta: 523,
      yellow: 440,
      lime: 659
    };

    let sequence = [];
    let playerIndex = 0;
    let acceptingInput = false;
    let bestStreak = 0;
    let strictMode = false;
    let audioCtx;

    const activateAudio = () => {
      if (!audioCtx && 'AudioContext' in window) {
        audioCtx = new AudioContext();
      }
    };

    const playTone = (color, duration = 420) => {
      if (!audioCtx) {
        return;
      }
      const freq = toneMap[color];
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      oscillator.type = 'sine';
      oscillator.frequency.value = freq;
      gainNode.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.04);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration / 1000);

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.start();
      oscillator.stop(audioCtx.currentTime + duration / 1000 + 0.08);
    };

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    const setStatus = (message, state = 'idle') => {
      statusEl.textContent = message;
      statusEl.dataset.state = state;
    };

    const setPadsDisabled = (disabled) => {
      pads.forEach((pad) => {
        pad.classList.toggle('disabled', disabled);
        pad.setAttribute('aria-disabled', String(disabled));
      });
    };

    const flashPad = async (pad, tone = true, duration = 420) => {
      pad.classList.add('flash');
      if (tone) {
        playTone(pad.dataset.color, duration);
      }
      await sleep(duration);
      pad.classList.remove('flash');
    };

    const playSequence = async () => {
      acceptingInput = false;
      setPadsDisabled(true);
      setStatus('Watch closely…');
      await sleep(400);
      const pace = Math.max(340, 700 - sequence.length * 28);
      for (const color of sequence) {
        const pad = pads.find((p) => p.dataset.color === color);
        if (pad) {
          await flashPad(pad, true, pace);
          await sleep(120);
        }
      }
      setStatus('Your turn!');
      setPadsDisabled(false);
      acceptingInput = true;
      playerIndex = 0;
    };

    const updateRoundDisplay = () => {
      roundDisplay.textContent = `Round ${sequence.length}`;
    };

    const updateBest = (rounds) => {
      bestStreak = Math.max(bestStreak, rounds);
      streakDisplay.textContent = `Best: ${bestStreak}`;
    };

    const resetGame = () => {
      sequence = [];
      playerIndex = 0;
      acceptingInput = false;
      setPadsDisabled(true);
      updateRoundDisplay();
    };

    const startGame = async () => {
      activateAudio();
      resetGame();
      setStatus('Memorize the pattern…');
      startBtn.disabled = true;
      strictBtn.disabled = true;
      await sleep(300);
      await nextRound();
      startBtn.disabled = false;
      strictBtn.disabled = false;
    };

    const nextRound = async () => {
      const colors = Object.keys(toneMap);
      const nextColor = colors[Math.floor(Math.random() * colors.length)];
      sequence.push(nextColor);
      updateRoundDisplay();
      await playSequence();
    };

    const handlePadPress = async (pad) => {
      if (!acceptingInput) {
        return;
      }
      const color = pad.dataset.color;
      acceptingInput = false;
      await flashPad(pad, true, 300);
      acceptingInput = true;

      if (color !== sequence[playerIndex]) {
        setStatus('Oops! Try again.', 'error');
        updateBest(sequence.length - 1);
        if (strictMode) {
          await sleep(700);
          setStatus('Restarting from round 1…');
          await sleep(600);
          await startGame();
          return;
        }
        playerIndex = 0;
        await sleep(700);
        await playSequence();
        return;
      }

      playerIndex += 1;

      if (playerIndex === sequence.length) {
        updateBest(sequence.length);
        setStatus('Great! Get ready for the next one.', 'success');
        acceptingInput = false;
        setPadsDisabled(true);
        await sleep(900);
        await nextRound();
      }
    };

    pads.forEach((pad) => {
      pad.addEventListener('click', () => handlePadPress(pad));
      pad.addEventListener('pointerdown', () => pad.classList.add('press'));
      pad.addEventListener('pointerup', () => pad.classList.remove('press'));
      pad.addEventListener('pointerleave', () => pad.classList.remove('press'));
    });

    startBtn.addEventListener('click', () => {
      startGame().catch((err) => {
        console.error(err);
        setStatus('Unable to start game', 'error');
      });
    });

    strictBtn.addEventListener('click', () => {
      strictMode = !strictMode;
      strictBtn.setAttribute('aria-pressed', String(strictMode));
      strictBtn.textContent = `Strict Mode: ${strictMode ? 'On' : 'Off'}`;
    });

    // prepare initial state
    resetGame();
  </script>
</body>
</html>
